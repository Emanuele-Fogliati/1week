name: Pubblica il sito su GitHub Pages

on:
  push:
    branches: [claude/project-thread-6dog6b]
    paths: ["H-germania-senza-tedesco/sito/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: H-germania-senza-tedesco/sito
      - id: deployment
        uses: actions/deploy-pages@v4
